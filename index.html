<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>點位數據紀錄系統</title>
  <style>
    * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: #f4f6f8; margin: 0; padding: 10px 15px 30px 15px; }
    
    /* 12個按鈕網格 */
    .btn-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-bottom: 15px; }
    .btn-point { padding: 12px 0; font-size: 16px; font-weight: bold; background: white; border: 1px solid #ccc; border-radius: 6px; color: #333; }
    .btn-point.active { background-color: #007bff; color: white; border-color: #007bff; }
    
    /* 卡片與欄位 */
    .card { background: white; border-radius: 8px; padding: 15px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); margin-bottom: 15px; }
    .card-title { font-size: 18px; font-weight: bold; margin-bottom: 10px; color: #007bff; }
    
    .data-row { display: flex; justify-content: space-between; background: #f8f9fa; padding: 8px; border-radius: 4px; margin-bottom: 10px; font-size: 14px; }
    .data-label { color: #666; }
    .data-val { font-weight: bold; color: #222; }

    .input-group { display: flex; gap: 8px; margin-top: 8px; }
    .input-field { flex: 1; display: flex; flex-direction: column; }
    .input-field label { font-size: 12px; color: #555; margin-bottom: 4px; }
    .input-field input { padding: 12px; font-size: 18px; border: 1px solid #ccc; border-radius: 4px; text-align: center; background: #fff; }
    .input-field input:focus { border-color: #007bff; outline: none; background: #eef6ff; }

    .btn-submit { width: 100%; padding: 14px; font-size: 18px; font-weight: bold; background: #28a745; color: white; border: none; border-radius: 6px; margin-top: 10px; }
  </style>
</head>
<body>

  <!-- 點位選擇按鈕 B01-B12 -->
  <div class="btn-grid" id="pointButtons"></div>

  <!-- 目前選擇點位提示 -->
  <div class="card-title" id="currentPointTitle" style="text-align: center;">請選擇點位</div>

  <!-- E 數據卡片 -->
  <div class="card">
    <div class="card-title">E 數據</div>
    <div class="data-row"><span class="data-label">上次數據:</span> <span class="data-val" id="eLast">--</span></div>
    <div class="data-row"><span class="data-label">原始數據:</span> <span class="data-val" id="eOrig">--</span></div>
    <div class="input-group">
      <div class="input-field"><label>正鏡</label><input type="text" id="eDirect" inputmode="decimal" pattern="[0-9.]*" placeholder="0.0" oninput="filterInput(this)"></div>
      <div class="input-field"><label>倒鏡</label><input type="text" id="eReverse" inputmode="decimal" pattern="[0-9.]*" placeholder="0.0" oninput="filterInput(this)"></div>
    </div>
  </div>

  <!-- N 數據卡片 -->
  <div class="card">
    <div class="card-title">N 數據</div>
    <div class="data-row"><span class="data-label">上次數據:</span> <span class="data-val" id="nLast">--</span></div>
    <div class="data-row"><span class="data-label">原始數據:</span> <span class="data-val" id="nOrig">--</span></div>
    <div class="input-group">
      <div class="input-field"><label>正鏡</label><input type="text" id="nDirect" inputmode="decimal" pattern="[0-9.]*" placeholder="0.0" oninput="filterInput(this)"></div>
      <div class="input-field"><label>倒鏡</label><input type="text" id="nReverse" inputmode="decimal" pattern="[0-9.]*" placeholder="0.0" oninput="filterInput(this)"></div>
    </div>
  </div>

  <!-- EL 數據卡片 -->
  <div class="card">
    <div class="card-title">EL 數據</div>
    <div class="data-row"><span class="data-label">上次數據:</span> <span class="data-val" id="elLast">--</span></div>
    <div class="data-row"><span class="data-label">原始數據:</span> <span class="data-val" id="elOrig">--</span></div>
    <div class="input-group">
      <div class="input-field"><label>正鏡</label><input type="text" id="elDirect" inputmode="decimal" pattern="[0-9.]*" placeholder="0.0" oninput="filterInput(this)"></div>
      <div class="input-field"><label>倒鏡</label><input type="text" id="elReverse" inputmode="decimal" pattern="[0-9.]*" placeholder="0.0" oninput="filterInput(this)"></div>
    </div>
  </div>

  <button class="btn-submit" id="submitBtn" onclick="submitData()">儲存並傳送紀錄</button>

  <script>
    // ⚠️ 請替換為你的 Google Apps Script URL
    const GAS_URL = "https://script.google.com/macros/s/AKfycbz-Tqr4RAMYXP8u2sHKQm8FSkF_yYLXfuZwBGJdrahYDS8uBlLWvfQGuc4wR81dpEYn/exec";

    let currentPoint = "B01";
    let allData = [];

    // 初始化建置 B01-B12 按鈕
    function initButtons() {
      const grid = document.getElementById("pointButtons");
      for (let i = 1; i <= 12; i++) {
        const pId = "B" + String(i).padStart(2, '0');
        const btn = document.createElement("button");
        btn.className = `btn-point ${pId === currentPoint ? 'active' : ''}`;
        btn.textContent = pId;
        btn.onclick = () => selectPoint(pId);
        grid.appendChild(btn);
      }
    }

    // 切換點位
    function selectPoint(pId) {
      currentPoint = pId;
      document.querySelectorAll(".btn-point").forEach(btn => {
        btn.classList.toggle("active", btn.textContent === pId);
      });
      document.getElementById("currentPointTitle").textContent = `目前點位：${pId}`;
      clearInputs();
      renderPointData();
    }

    // 限制輸入框只允許 0-9 與最多一個小數點
    function filterInput(input) {
      // 1. 先清除非數字與小數點的字元
      let val = input.value.replace(/[^0-9.]/g, '');
      
      // 2. 避免輸入多個小數點 (只保留第一個小數點)
      const parts = val.split('.');
      if (parts.length > 2) {
        val = parts[0] + '.' + parts.slice(1).join('');
      }
      
      input.value = val;
    }

    // 讀取試算表資料
    function loadData() {
      fetch(GAS_URL)
        .then(res => res.json())
        .then(rows => {
          allData = rows;
          renderPointData();
        })
        .catch(err => console.error("讀取失敗", err));
    }

    // 依據 A~K 欄順序讀取並顯示「原始數據」與「上次數據」
    function renderPointData() {
      const pointRecords = allData.filter(row => String(row[1]).trim() === currentPoint);

      if (pointRecords.length === 0) {
        setVal("eOrig", "--"); setVal("eLast", "--");
        setVal("nOrig", "--"); setVal("nLast", "--");
        setVal("elOrig", "--"); setVal("elLast", "--");
        return;
      }

      // 第一筆紀錄 (原始數據) - F/G: E正/倒, H/I: N正/倒, J/K: EL正/倒
      const first = pointRecords[0];
      setVal("eOrig", `正:${first[5] || '--'} / 倒:${first[6] || '--'}`);
      setVal("nOrig", `正:${first[7] || '--'} / 倒:${first[8] || '--'}`);
      setVal("elOrig", `正:${first[9] || '--'} / 倒:${first[10] || '--'}`);

      // 最後一筆紀錄 (上次數據)
      const last = pointRecords[pointRecords.length - 1];
      setVal("eLast", `正:${last[5] || '--'} / 倒:${last[6] || '--'}`);
      setVal("nLast", `正:${last[7] || '--'} / 倒:${last[8] || '--'}`);
      setVal("elLast", `正:${last[9] || '--'} / 倒:${last[10] || '--'}`);
    }

    function setVal(id, text) { document.getElementById(id).textContent = text; }

    // 送出資料
    function submitData() {
      const payload = {
        pointId: currentPoint,
        eDirect: document.getElementById("eDirect").value,
        eReverse: document.getElementById("eReverse").value,
        nDirect: document.getElementById("nDirect").value,
        nReverse: document.getElementById("nReverse").value,
        elDirect: document.getElementById("elDirect").value,
        elReverse: document.getElementById("elReverse").value
      };

      const btn = document.getElementById("submitBtn");
      btn.disabled = true;
      btn.textContent = "傳送中...";

      fetch(GAS_URL, {
        method: "POST",
        mode: "no-cors",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(payload)
      })
      .then(() => {
        alert(`${currentPoint} 資料儲存成功！`);
        clearInputs();
        loadData(); // 重新整理最新數據
      })
      .catch(err => alert("失敗：" + err))
      .finally(() => {
        btn.disabled = false;
        btn.textContent = "儲存並傳送紀錄";
      });
    }

    function clearInputs() {
      ["eDirect","eReverse","nDirect","nReverse","elDirect","elReverse"].forEach(id => {
        document.getElementById(id).value = "";
      });
    }

    window.onload = () => {
      initButtons();
      selectPoint("B01");
      loadData();
    };
  </script>
</body>
</html>
