<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>點位數據紀錄系統</title>
  <style>
    *, *::before, *::after { 
      box-sizing: border-box; 
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
    }
    
    html, body {
      width: 100%;
      overflow-x: hidden;
      background-color: #f4f6f8;
    }

    body { 
      padding: 12px 10px 30px 10px; 
    }
    
    /* 點位選擇按鈕 4 欄網格 */
    .btn-grid { 
      display: grid; 
      grid-template-columns: repeat(4, 1fr); 
      gap: 6px; 
      margin-bottom: 12px; 
      width: 100%;
    }
    
    .btn-point { 
      padding: 10px 0; 
      font-size: 15px; 
      font-weight: bold; 
      background: white; 
      border: 1px solid #ccc; 
      border-radius: 6px; 
      color: #333; 
      width: 100%;
      text-align: center;
      cursor: pointer;
    }
    
    .btn-point.active { 
      background-color: #007bff; 
      color: white; 
      border-color: #007bff; 
    }
    
    .card { 
      background: white; 
      border-radius: 8px; 
      padding: 12px; 
      box-shadow: 0 2px 5px rgba(0,0,0,0.05); 
      margin-bottom: 12px; 
      width: 100%;
    }

    .card-title { 
      font-size: 17px; 
      font-weight: bold; 
      margin-bottom: 8px; 
      color: #007bff; 
    }
    
    /* 歷史數據與時間欄位樣式 */
    .data-row { 
      display: flex; 
      justify-content: space-between; 
      align-items: center;
      background: #f8f9fa; 
      padding: 7px 10px; 
      border-radius: 4px; 
      margin-bottom: 5px; 
      font-size: 13px; 
      word-break: break-all;
    }

    .data-row.time-row {
      background: #f0f4f8;
      border-left: 3px solid #007bff;
    }

    .data-label { color: #666; flex-shrink: 0; }
    .data-val { font-weight: bold; color: #222; text-align: right; }
    .data-val.time-val { color: #28a745; }

    /* 即時平均計算框 */
    .calc-box { 
      background: #eef6ff; 
      border: 1px dashed #007bff; 
      padding: 8px; 
      border-radius: 4px; 
      margin-top: 8px; 
      font-size: 14px; 
      text-align: center; 
      color: #0056b3; 
      font-weight: bold; 
      width: 100%;
    }

    /* 輸入區塊與正負號按鈕 */
    .input-group { 
      display: flex; 
      gap: 8px; 
      margin-top: 8px; 
      width: 100%;
    }

    .input-field { 
      flex: 1; 
      min-width: 0; 
      display: flex; 
      flex-direction: column; 
    }

    .input-field label { 
      font-size: 12px; 
      color: #555; 
      margin-bottom: 4px; 
    }

    .input-wrapper {
      display: flex;
      gap: 4px;
    }

    .input-wrapper input { 
      flex: 1;
      width: 100%;
      padding: 10px 4px; 
      font-size: 17px; 
      border: 1px solid #ccc; 
      border-radius: 4px; 
      text-align: center; 
      background: #fff; 
      -webkit-appearance: none; 
    }

    .input-wrapper input:focus { 
      border-color: #007bff; 
      outline: none; 
    }

    .btn-toggle-sign {
      width: 38px;
      background: #e9ecef;
      border: 1px solid #ccc;
      border-radius: 4px;
      font-size: 16px;
      font-weight: bold;
      color: #333;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .btn-toggle-sign:active {
      background: #ced4da;
    }

    .btn-submit { 
      width: 100%; 
      padding: 14px; 
      font-size: 18px; 
      font-weight: bold; 
      background: #28a745; 
      color: white; 
      border: none; 
      border-radius: 6px; 
      margin-top: 10px; 
      cursor: pointer;
    }
  </style>
</head>
<body>

  <!-- 點位選擇按鈕 B01-B12 -->
  <div class="btn-grid" id="pointButtons"></div>

  <!-- 目前選擇點位標題 -->
  <div class="card-title" id="currentPointTitle" style="text-align: center;">請選擇點位</div>

  <!-- E 數據卡片 -->
  <div class="card">
    <div class="card-title">E 數據</div>
    <div class="data-row"><span class="data-label">原始 E 數據:</span> <span class="data-val" id="eOrig">--</span></div>
    <div class="data-row time-row"><span class="data-label">上次紀錄時間:</span> <span class="data-val time-val" id="eLastTime">--</span></div>
    <div class="data-row"><span class="data-label">上次 E 數據 (平均):</span> <span class="data-val" id="eLastAvg">--</span></div>
    <div class="data-row"><span class="data-label">上次正/倒鏡:</span> <span class="data-val" id="eLastDetails">--</span></div>
    
    <div class="input-group">
      <div class="input-field">
        <label>正鏡</label>
        <div class="input-wrapper">
          <input type="text" id="eDirect" inputmode="decimal" placeholder="0.0" oninput="handleInput(this, 'e')">
          <button type="button" class="btn-toggle-sign" onclick="toggleSign('eDirect', 'e')">±</button>
        </div>
      </div>
      <div class="input-field">
        <label>倒鏡</label>
        <div class="input-wrapper">
          <input type="text" id="eReverse" inputmode="decimal" placeholder="0.0" oninput="handleInput(this, 'e')">
          <button type="button" class="btn-toggle-sign" onclick="toggleSign('eReverse', 'e')">±</button>
        </div>
      </div>
    </div>
    <div class="calc-box" id="eCalc">本次即時平均：--</div>
  </div>

  <!-- N 數據卡片 -->
  <div class="card">
    <div class="card-title">N 數據</div>
    <div class="data-row"><span class="data-label">原始 N 數據:</span> <span class="data-val" id="nOrig">--</span></div>
    <div class="data-row time-row"><span class="data-label">上次紀錄時間:</span> <span class="data-val time-val" id="nLastTime">--</span></div>
    <div class="data-row"><span class="data-label">上次 N 數據 (平均):</span> <span class="data-val" id="nLastAvg">--</span></div>
    <div class="data-row"><span class="data-label">上次正/倒鏡:</span> <span class="data-val" id="nLastDetails">--</span></div>
    
    <div class="input-group">
      <div class="input-field">
        <label>正鏡</label>
        <div class="input-wrapper">
          <input type="text" id="nDirect" inputmode="decimal" placeholder="0.0" oninput="handleInput(this, 'n')">
          <button type="button" class="btn-toggle-sign" onclick="toggleSign('nDirect', 'n')">±</button>
        </div>
      </div>
      <div class="input-field">
        <label>倒鏡</label>
        <div class="input-wrapper">
          <input type="text" id="nReverse" inputmode="decimal" placeholder="0.0" oninput="handleInput(this, 'n')">
          <button type="button" class="btn-toggle-sign" onclick="toggleSign('nReverse', 'n')">±</button>
        </div>
      </div>
    </div>
    <div class="calc-box" id="nCalc">本次即時平均：--</div>
  </div>

  <!-- EL 數據卡片 -->
  <div class="card">
    <div class="card-title">EL 數據</div>
    <div class="data-row"><span class="data-label">原始 EL 數據:</span> <span class="data-val" id="elOrig">--</span></div>
    <div class="data-row time-row"><span class="data-label">上次紀錄時間:</span> <span class="data-val time-val" id="elLastTime">--</span></div>
    <div class="data-row"><span class="data-label">上次 EL 數據 (平均):</span> <span class="data-val" id="elLastAvg">--</span></div>
    <div class="data-row"><span class="data-label">上次正/倒鏡:</span> <span class="data-val" id="elLastDetails">--</span></div>
    
    <div class="input-group">
      <div class="input-field">
        <label>正鏡</label>
        <div class="input-wrapper">
          <input type="text" id="elDirect" inputmode="decimal" placeholder="0.0" oninput="handleInput(this, 'el')">
          <button type="button" class="btn-toggle-sign" onclick="toggleSign('elDirect', 'el')">±</button>
        </div>
      </div>
      <div class="input-field">
        <label>倒鏡</label>
        <div class="input-wrapper">
          <input type="text" id="elReverse" inputmode="decimal" placeholder="0.0" oninput="handleInput(this, 'el')">
          <button type="button" class="btn-toggle-sign" onclick="toggleSign('elReverse', 'el')">±</button>
        </div>
      </div>
    </div>
    <div class="calc-box" id="elCalc">本次即時平均：--</div>
  </div>

  <button class="btn-submit" id="submitBtn" onclick="submitData()">儲存並傳送紀錄</button>

  <script>
    // ⚠️ 請填入您 Apps Script 部署發布後的 Web App URL
    const GAS_URL = "https://script.google.com/macros/s/AKfycbwI4rmeNP189PYLOsIWhdxc_ZAqxN3So-72S-C3NEnJCmz-Vq_Zc4TvvvHN8Y89sOrQ/exec";

    let currentPoint = "B01";
    let allData = [];

    // 初始化 B01 - B12 按鈕
    function initButtons() {
      const grid = document.getElementById("pointButtons");
      for (let i = 1; i <= 12; i++) {
        const pId = "B" + String(i).padStart(2, '0');
        const btn = document.createElement("button");
        btn.className = `btn-point ${pId === currentPoint ? 'active' : ''}`;
        btn.textContent = pId;
        btn.onclick = () => selectPoint(pId);
        grid.appendChild(btn);
      }
    }

    // 切換點位 (0 秒響應)
    function selectPoint(pId) {
      currentPoint = pId;
      document.querySelectorAll(".btn-point").forEach(btn => {
        btn.classList.toggle("active", btn.textContent === pId);
      });
      document.getElementById("currentPointTitle").textContent = `目前點位：${pId}`;
      clearInputs();
      renderPointData();
    }

    // 正負號切換按鈕 (±)
    function toggleSign(inputId, type) {
      const input = document.getElementById(inputId);
      let val = input.value.trim();

      if (!val) return;

      if (val.startsWith('-')) {
        input.value = val.substring(1);
      } else {
        input.value = '-' + val;
      }

      updateLiveAvg(type);
    }

    // 格式化輸入
    function handleInput(input, type) {
      let val = input.value;
      const isNegative = val.startsWith('-');

      val = val.replace(/[^0-9.]/g, '');

      const parts = val.split('.');
      if (parts.length > 2) {
        val = parts[0] + '.' + parts.slice(1).join('');
      }

      if (isNegative) {
        val = '-' + val;
      }

      input.value = val;
      updateLiveAvg(type);
    }

    // 即時計算平均值
    function updateLiveAvg(type) {
      const dVal = parseFloat(document.getElementById(`${type}Direct`).value);
      const rVal = parseFloat(document.getElementById(`${type}Reverse`).value);

      const hasD = !isNaN(dVal);
      const hasR = !isNaN(rVal);

      let avgText = "--";
      if (hasD && hasR) {
        avgText = ((dVal + rVal) / 2).toFixed(4);
      } else if (hasD) {
        avgText = dVal.toFixed(4);
      } else if (hasR) {
        avgText = rVal.toFixed(4);
      }

      document.getElementById(`${type}Calc`).textContent = `本次即時平均：${avgText}`;
    }

    // 🚀 優化一：快取優先 + 背景同步 (0 秒加載體驗)
    function loadData() {
      // 1. 先讀取快取
      const cached = localStorage.getItem("point_sheet_data");
      if (cached) {
        try {
          allData = JSON.parse(cached);
          renderPointData();
        } catch (e) {
          console.error("快取讀取失敗", e);
        }
      }

      // 2. 背景請求 GAS 最新資料
      fetch(GAS_URL)
        .then(res => res.json())
        .then(rows => {
          allData = rows;
          localStorage.setItem("point_sheet_data", JSON.stringify(rows));
          renderPointData(); // 自動背景刷新
        })
        .catch(err => console.error("背景同步失敗:", err));
    }

    // 時間格式化工具：例如轉換成 "09/30 15:30"
    function formatDate(timeStr) {
      if (!timeStr || timeStr === "--") return "--";
      const d = new Date(timeStr);
      if (isNaN(d.getTime())) return timeStr; // 如果無法解析則原樣顯示

      const month = String(d.getMonth() + 1).padStart(2, '0');
      const date = String(d.getDate()).padStart(2, '0');
      const hours = String(d.getHours()).padStart(2, '0');
      const minutes = String(d.getMinutes()).padStart(2, '0');

      return `${month}/${date} ${hours}:${minutes}`;
    }

    // 渲染資料 (包含上次時間)
    function renderPointData() {
      const pointRecords = allData.filter(row => String(row[1]).trim() === currentPoint);

      if (pointRecords.length === 0) {
        setVal("eOrig", "--"); setVal("eLastTime", "--"); setVal("eLastAvg", "--"); setVal("eLastDetails", "--");
        setVal("nOrig", "--"); setVal("nLastTime", "--"); setVal("nLastAvg", "--"); setVal("nLastDetails", "--");
        setVal("elOrig", "--"); setVal("elLastTime", "--"); setVal("elLastAvg", "--"); setVal("elLastDetails", "--");
        return;
      }

      // 1. 第一筆記錄 (原始數據：C, D, E 欄)
      const first = pointRecords[0];
      setVal("eOrig", first[2] || "--");
      setVal("nOrig", first[3] || "--");
      setVal("elOrig", first[4] || "--");

      // 2. 最後一筆記錄 (上次數據：A 欄時間, C~E 欄平均, F~K 欄細節)
      const last = pointRecords[pointRecords.length - 1];
      const formattedTime = formatDate(last[0]);

      // E 數據
      setVal("eLastTime", formattedTime);
      setVal("eLastAvg", last[2] || "--");
      setVal("eLastDetails", `正:${last[5] || '--'} / 倒:${last[6] || '--'}`);
      
      // N 數據
      setVal("nLastTime", formattedTime);
      setVal("nLastAvg", last[3] || "--");
      setVal("nLastDetails", `正:${last[7] || '--'} / 倒:${last[8] || '--'}`);
      
      // EL 數據
      setVal("elLastTime", formattedTime);
      setVal("elLastAvg", last[4] || "--");
      setVal("elLastDetails", `正:${last[9] || '--'} / 倒:${last[10] || '--'}`);
    }

    function setVal(id, text) { 
      document.getElementById(id).textContent = text; 
    }

    // 🚀 優化三：樂觀更新 (按下儲存 0 秒反饋)
    function submitData() {
      const eDirect = document.getElementById("eDirect").value;
      const eReverse = document.getElementById("eReverse").value;
      const nDirect = document.getElementById("nDirect").value;
      const nReverse = document.getElementById("nReverse").value;
      const elDirect = document.getElementById("elDirect").value;
      const elReverse = document.getElementById("elReverse").value;

      // 輔助計算平均
      const calcAvg = (d, r) => {
        let numD = parseFloat(d), numR = parseFloat(r);
        if (!isNaN(numD) && !isNaN(numR)) return ((numD + numR) / 2).toFixed(4);
        if (!isNaN(numD)) return numD.toFixed(4);
        if (!isNaN(numR)) return numR.toFixed(4);
        return "";
      };

      const now = new Date().toISOString();

      // 本地樂觀更新資料結構
      const newRow = [
        now,
        currentPoint,
        calcAvg(eDirect, eReverse),
        calcAvg(nDirect, nReverse),
        calcAvg(elDirect, elReverse),
        eDirect, eReverse, nDirect, nReverse, elDirect, elReverse
      ];

      // 1. 立刻在前端更新 & 寫入本地快取
      allData.push(newRow);
      localStorage.setItem("point_sheet_data", JSON.stringify(allData));
      
      // 2. 立刻渲染畫面並清空輸入框
      renderPointData();
      clearInputs();

      // 3. 背景靜默傳送至 GAS 後端
      const btn = document.getElementById("submitBtn");
      btn.disabled = true;
      btn.textContent = "傳送中...";

      const payload = {
        pointId: currentPoint,
        eDirect, eReverse, nDirect, nReverse, elDirect, elReverse
      };

      fetch(GAS_URL, {
        method: "POST",
        mode: "no-cors",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(payload)
      })
      .then(() => {
        // 背景成功上傳
      })
      .catch(err => console.error("靜默上傳失敗:", err))
      .finally(() => {
        btn.disabled = false;
        btn.textContent = "儲存並傳送紀錄";
      });
    }

    // 清空輸入框
    function clearInputs() {
      ["eDirect","eReverse","nDirect","nReverse","elDirect","elReverse"].forEach(id => {
        document.getElementById(id).value = "";
      });
      ["eCalc","nCalc","elCalc"].forEach(id => {
        document.getElementById(id).textContent = "本次即時平均：--";
      });
    }

    window.onload = () => {
      initButtons();
      selectPoint("B01");
      loadData();
    };
  </script>
</body>
</html>
